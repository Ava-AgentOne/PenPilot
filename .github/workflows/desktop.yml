# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Builds PenPilot's Windows installer and portable .exe on a real Windows machine.
# Runs only when started by hand (Actions tab, or `gh workflow run desktop.yml`)
# or when a version tag like v0.1.0 is pushed. The Mac .dmg is built locally.
name: Desktop app (Windows)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer + portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      # --ignore-scripts: skips saxi's server build and Electron's own download;
      # electron-builder fetches the Electron runtime it packages by itself.
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PenPilot-windows
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 30
